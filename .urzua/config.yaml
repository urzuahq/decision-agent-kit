# Generated by `urzua init --types` (greenfield mode). Each type below is a built-in
# profile written out in full: edit any line.

schema_version: 2
record_types:
  adr:
    dir: docs/adr
    prefix: ADR
    required_fields:
      - Status
      - Date
      - Author
      - Deciders
      - Stable-Id
    header_shape: yaml-frontmatter
    known_fields:
      - Supersedes
    pointer_fields:
      - name: Supersedes
        targets:
          - adr
    narrative_fields: []
    relation_fields:
      date: Date
      author: Author
    statuses:
      values:
        - Proposed
        - Accepted
        - Rejected
        - Superseded
      success:
        - Accepted
      failure:
        - Rejected
        - Superseded
      implementable:
        - Accepted
      initial:
        - Proposed
      transitions:
        Proposed:
          - Accepted
          - Rejected
        Accepted:
          - Superseded
  rfc:
    dir: docs/rfc
    prefix: RFC
    required_fields:
      - Status
      - Date
      - Author
      - Stable-Id
    header_shape: yaml-frontmatter
    known_fields: []
    relation_fields:
      date: Date
      author: Author
    statuses:
      values:
        - Draft
        - Discussion
        - Accepted
        - Rejected
        - Superseded
      success:
        - Accepted
      failure:
        - Rejected
        - Superseded
      implementable:
        - Accepted
      initial:
        - Draft
      transitions:
        Draft:
          - Discussion
          - Accepted
          - Rejected
        Discussion:
          - Accepted
          - Rejected
        Accepted:
          - Superseded
  spec:
    dir: docs/spec
    prefix: SPEC
    required_fields:
      - Status
      - Date
      - Version
      - Author
      - Subject
      - Stable-Id
    header_shape: yaml-frontmatter
    known_fields: []
    relation_fields:
      date: Date
      author: Author
      title: Subject
    statuses:
      values:
        - Draft
        - Accepted
        - Shipped
      success:
        - Accepted
        - Shipped
      implementable:
        - Accepted
        - Shipped
      initial:
        - Draft
      transitions:
        Draft:
          - Accepted
        Accepted:
          - Shipped
    revision_log:
      marker: '**Revision log**'
      required: true
      classes:
        - substantive
        - structural
      class_column: Class
      date_column: Date
      tool_class: structural
      version_bump:
        field: Version
        classes:
          - substantive
          - structural
        initial: '0.1'
  task:
    dir: docs/task
    prefix: TASK
    required_fields:
      - Status
      - Kind
      - Date
      - Author
      - Stable-Id
    header_shape: yaml-frontmatter
    known_fields:
      - Milestone
      - Depends-on
      - Blocks
      - Implements
      - Severity
    field_values:
      Kind:
        - feature
        - bug
        - chore
    pointer_fields:
      - name: Milestone
        targets:
          - milestone
        part_of: true
      - Depends-on
      - Blocks
      - Implements
    narrative_fields: []
    relation_fields:
      date: Date
      author: Author
    statuses:
      values:
        - Open
        - InProgress
        - Done
        - WontDo
        - Paused
      success:
        - Done
      failure:
        - WontDo
      initial:
        - Open
      progress:
        - InProgress
      transitions:
        Open:
          - InProgress
          - Done
          - WontDo
          - Paused
        InProgress:
          - Open
          - Done
          - WontDo
          - Paused
        Done:
          - InProgress
        Paused:
          - Open
          - InProgress
          - WontDo
      require:
        - when_field:
            Kind:
              - bug
          fields:
            - Severity
      delivery:
        delivered_tiers:
          - Implemented
          - Verified
        unevidenced_tiers:
          - Not started
        not_done:
          - Open
          - InProgress
        set_status: Done
        items:
          section: Acceptance checks
          clause_separator: ' — '
          evidence_marker: 'evidence:'
          waiver_marker: 'waived:'
          partial_status: InProgress
          resolving_tiers:
            - Specified
            - Implemented
            - Verified
          waiver_categories:
            - name: not-applicable
            - name: manual-observation
    sections:
      from: headings
      depth: 2
      required:
        - name: Acceptance checks
  milestone:
    dir: docs/milestone
    prefix: MILE
    required_fields:
      - Status
      - Date
      - Author
      - Stable-Id
    header_shape: yaml-frontmatter
    known_fields:
      - Epic
      - Depends-on
      - Blocks
      - Implements
    pointer_fields:
      - name: Epic
        targets:
          - epic
        part_of: true
      - Depends-on
      - Blocks
      - Implements
    narrative_fields: []
    relation_fields:
      date: Date
      author: Author
    statuses:
      values:
        - Planned
        - InProgress
        - Done
        - WontDo
        - Paused
      success:
        - Done
      failure:
        - WontDo
      initial:
        - Planned
      progress:
        - InProgress
      transitions:
        Planned:
          - InProgress
          - Done
          - WontDo
          - Paused
        InProgress:
          - Planned
          - Done
          - WontDo
          - Paused
        Done:
          - InProgress
        Paused:
          - Planned
          - InProgress
          - WontDo
  epic:
    dir: docs/epic
    prefix: EPIC
    required_fields:
      - Status
      - Date
      - Author
      - Stable-Id
    header_shape: yaml-frontmatter
    known_fields:
      - Implements
    pointer_fields:
      - Implements
    narrative_fields: []
    relation_fields:
      date: Date
      author: Author
    statuses:
      values:
        - Planned
        - Active
        - Done
        - Dropped
        - Paused
      success:
        - Done
      failure:
        - Dropped
      initial:
        - Planned
      progress:
        - Active
      transitions:
        Planned:
          - Active
          - Dropped
          - Paused
        Active:
          - Planned
          - Done
          - Dropped
          - Paused
        Done:
          - Active
        Paused:
          - Planned
          - Active
          - Dropped
relation_pairs:
  - name: sequencing
    forward: Depends-on
    inverse: Blocks
    reciprocity: none
    cross_type: true
    acyclic: true
roadmap:
  pairs:
    - sequencing
  group_by:
    - Milestone
    - Epic
  work_types:
    - task
    - milestone
    - epic
rules:
  header.required-fields: warn
  field.quality: warn
  field.pending: warn
  filename.title-consistency: warn
  revision-log.change-class-required: warn
  revision-log.version-bump-required: warn
  header.field-set-consistency: warn
  field.untrimmed-value: warn
  field.leading-reserved-indicator: warn
  header.field-case-mismatch: warn
  header.case-variant-key: warn
  type.dir-matches-nothing: warn
  identity.collision: warn
  identity.open-pr-collision: warn
  type.record-outside-declared-dir: warn
  config.scope-matches-nothing: warn
  config.companion-declaration-missing: warn
  config.pointer-declaration-missing: warn
  config.pointer-field-not-known: warn
  config.pointer-narrative-overlap: warn
  config.header-none-has-no-required-fields: warn
  config.relation-field-not-known: warn
  config.known-fields-declaration-missing: warn
  config.schema-version-outdated: warn
  filename.identity-pattern: warn
  status.undeclared-value: warn
  status.transition-allowed: warn
  status.unreachable-state: warn
  pointer.resolution: error
  diff.decider-required: error
  header.pointer-field-clean: warn
  sequence.cycle: error
  sequence.unresolved-blocker: error
authority:
  decider_table: base
  waivable: never
  deciders:
    maintainers:
      logins:
        - beauwilliams
  gates:
    - type: adr
      to:
        - Accepted
      by: maintainers
    - type: rfc
      to:
        - Accepted
      by: maintainers
    - type: spec
      to:
        - Accepted
      by: maintainers
    - paths:
        - .urzua/config.yaml
        - .claude
        - .github/workflows
      by: maintainers
harness:
  outside_writes: shared
  adapters:
    - claude-code
  guardrails:
    acceptance:
      enabled: true
    protected-paths:
      enabled: true
    post-command:
      enabled: true

# Examine a record `urzua new` just wrote before it is staged.
discovery:
  include_untracked: true

export:
  link_prefix: https://github.com/urzuahq/decision-agent-kit/blob/main/
